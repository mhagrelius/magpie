# Flatpak manifest for Magpie.
#
# The hard question here is the one the .deb does not have to answer: Magpie
# works by running yt-dlp, and a sandbox cannot run a program on the host. The
# only way to reach one is --talk-name=org.freedesktop.Flatpak, which is a
# sandbox escape with a polite name and is rejected by Flathub, correctly.
#
# So the Flatpak bundles yt-dlp as a build module: a pinned release with a
# checksum, updated by rebuilding the Flatpak. That is not the thing DESIGN.md
# argues against — the objection there is to an application *downloading
# executables at runtime* and marking them executable, outside any package
# manager and outside the user's knowledge. A versioned, checksummed build
# dependency is a package. It is also the one place the bundling has a cost worth
# naming: a Flatpak's yt-dlp is only as new as its last build, and yt-dlp going
# stale is the most common cause of a download failing. Magpie's Tools page shows
# the bundled version and its age for exactly this reason.
#
# whisper.cpp *is* built here, unlike yt-dlp's case, and for the opposite reason:
# it does not rot. It is local inference with no network and no site to keep up
# with, so a pinned version stays correct indefinitely, and there is no Ubuntu
# package for it — without building it the Transcribe switch would be greyed out
# for everyone. CPU only and `-DGGML_NATIVE=OFF`, so the binary runs on any x86-64
# rather than only on the machine that built it.
#
# What this build does NOT include:
#
#   an ffmpeg binary — the ffmpeg-full extension supplies the libraries, and
#     /usr/lib/ffmpeg is on PATH below in case a given runtime version also ships
#     the executable. Where it does not, Magpie reports FFmpeg as missing and the
#     "Best available" audio format still works, because it is a copy rather than
#     a transcode. Bundling ffmpeg is a later milestone.
#
# The supported path for v1 is the .deb or install.sh, against the system's own
# yt-dlp. This manifest is here because it should exist and be honest, not
# because it is the better route yet.
#
# Build:  packaging/build-flatpak.sh

id: us.hagreli.Magpie

# GNOME 50: the first runtime carrying libadwaita 1.9, which this is compiled
# against, and GTK 4.22. GTK must be at least 4.16 for the CSS custom properties
# the stylesheet uses.
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '25.08'
    add-ld-path: .
    no-autodownload: false
    autodelete: false

command: magpie

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

  # Unavoidable: the whole application is a network client. yt-dlp reaches the
  # sites, libsoup fetches poster images and whisper models.
  - --share=network

  # The default destination. Any other folder the user picks comes through the
  # file portal, and the document store keeps that grant across restarts — so
  # this is xdg-download rather than home.
  - --filesystem=xdg-download

  - --env=PATH=/app/bin:/usr/bin:/app/lib/ffmpeg:/usr/lib/ffmpeg

  # Deliberately absent:
  #   --talk-name=org.freedesktop.Flatpak   would let Magpie run host binaries,
  #                                         which is sandbox escape; see above
  #   --filesystem=home                     the portal covers folders the user
  #                                         chooses, one at a time
  #   --device=all                          nothing here touches hardware

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/magpie/cargo
  # No --share=network build-arg: Flathub builds with the network off, and
  # cargo-sources.json supplies every crate with a checksum, so it is not
  # needed. Adding it back would make this unacceptable for submission.

modules:
  # The mount point for the ffmpeg extension. An add-extensions directory has to
  # exist in the build or the runtime has nowhere to mount it.
  - name: ffmpeg-extension-point
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/ffmpeg

  # yt-dlp's official single-file build: a Python zipapp, which needs only the
  # python3 already in org.gnome.Platform. One file, one checksum, no pip
  # resolution and no vendored dependency tree.
  - name: yt-dlp
    buildsystem: simple
    build-commands:
      - install -Dm755 yt-dlp /app/bin/yt-dlp
    sources:
      # Generated by build-flatpak.sh, which pins the current release and its
      # sha256. Regenerate to update; there is no runtime updater by design.
      - tools-sources.json

  # whisper.cpp, for transcripts. Into /app/lib/magpie rather than /app/bin: it is
  # Magpie's private copy, and `model::tools::candidates` searches that directory
  # last so it can never shadow something the user installed.
  - name: whisper-cpp
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=OFF
      # Without this the build tunes itself to the builder's instruction set and
      # dies with SIGILL on an older CPU.
      - -DGGML_NATIVE=OFF
      - -DWHISPER_BUILD_TESTS=OFF
      - -DWHISPER_BUILD_SERVER=OFF
    build-commands:
      - install -Dm755 bin/whisper-cli /app/lib/magpie/whisper-cli
    sources:
      - type: git
        url: https://github.com/ggml-org/whisper.cpp.git
        tag: v1.9.1
        commit: f049fff95a089aa9969deb009cdd4892b3e74916

  # sherpa-onnx's diarizer, for identifying speakers. Fetched rather than built,
  # unlike whisper.cpp above, because upstream publishes a prebuilt binary for
  # every release — compiling it here would mean ONNX Runtime from source to
  # arrive at the same file. Pinned by sha256, so an offline builder reproduces
  # it and a changed asset fails the build rather than shipping quietly.
  #
  # `bin/` with a sibling `lib/`, not flattened into /app/lib/magpie: the binary
  # is linked with RPATH=$ORIGIN/../lib and will not start from anywhere else.
  # `model::tools::candidates` searches /app/lib/magpie/bin for exactly this.
  - name: sherpa-onnx-diarizer
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/sherpa-onnx-offline-speaker-diarization
          /app/lib/magpie/bin/sherpa-onnx-offline-speaker-diarization
      - install -d /app/lib/magpie/lib
      - install -Dm644 -t /app/lib/magpie/lib lib/libonnxruntime.so*
          lib/libsherpa-onnx-c-api.so lib/libsherpa-onnx-cxx-api.so
    sources:
      # The two architectures are not named to a pattern: x86-64's CPU build is
      # `-shared`, arm64's is `-shared-cpu`.
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.4/sherpa-onnx-v1.13.4-linux-x64-shared.tar.bz2
        sha256: 18887dc13c7d313d0e0f6c164ed31715c27c1c2c4f71acd7c0147dc84cf02514
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.4/sherpa-onnx-v1.13.4-linux-aarch64-shared-cpu.tar.bz2
        sha256: 36c5a3c942358ed635471488f50a28a96181331c935b0dce75a02b7f49913dc2

  - name: magpie
    buildsystem: simple
    build-options:
      env:
        # Dependencies come from cargo-sources.json, not the network, so
        # Flathub's offline builders can reproduce this.
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked

      - install -Dm755 target/release/magpie /app/bin/magpie
      - install -Dm644 data/us.hagreli.Magpie.desktop
          /app/share/applications/us.hagreli.Magpie.desktop
      - install -Dm644 data/us.hagreli.Magpie.metainfo.xml
          /app/share/metainfo/us.hagreli.Magpie.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/us.hagreli.Magpie.svg
          /app/share/icons/hicolor/scalable/apps/us.hagreli.Magpie.svg
      - install -Dm644 data/icons/hicolor/symbolic/apps/us.hagreli.Magpie-symbolic.svg
          /app/share/icons/hicolor/symbolic/apps/us.hagreli.Magpie-symbolic.svg

      # Required: the desktop file is DBusActivatable, and build-export fails
      # hard if the matching service file is missing.
      - install -Dm644 packaging/flatpak/us.hagreli.Magpie.service
          /app/share/dbus-1/services/us.hagreli.Magpie.service

    sources:
      # Local builds read the working tree. For a Flathub submission, replace
      # this with the tagged release:
      #
      #   - type: git
      #     url: https://github.com/mhagrelius/magpie.git
      #     tag: v0.1.0
      #     commit: <full sha>
      - type: dir
        path: ../..

      # Generated by build-flatpak.sh from Cargo.lock.
      - cargo-sources.json
